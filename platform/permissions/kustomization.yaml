apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: permissions

resources:
  - namespace.yaml
  - helm-release.yaml
  - database-role.yaml
  - database.yaml
  - db-credentials.yaml

configMapGenerator:
  - name: keto-values
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true