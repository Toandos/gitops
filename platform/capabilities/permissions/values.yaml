keto:
  automigration:
    enabled: true

  deployment:
    extraEnv:
      - name: DSN
        valueFrom:
          secretKeyRef:
            name: permissions-db-credentials
            key: DSN

  job:
    extraEnv:
      - name: DSN
        valueFrom:
          secretKeyRef:
            name: permissions-db-credentials
            key: DSN

  config:
    serve:
        read:
            port: 4466