apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keto
spec:
  interval: 30m
  chart:
    spec:
      chart: keto
      version: "v0.63.0"
      sourceRef:
        kind: HelmRepository
        name: ory
        namespace: platform-sources

  valuesFrom:
    - kind: ConfigMap
      name: keto-values
      valuesKey: values.yaml