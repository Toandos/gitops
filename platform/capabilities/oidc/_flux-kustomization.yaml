apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: oidc
  namespace: flux-system
spec:
  interval: 10m
  path: ./platform/capabilities/oidc
  prune: true
  wait: true
  dependsOn:
    - name: cloudnative-pg
    - name: external-secrets
    - name: kubernetes-replicator
  sourceRef:
    kind: GitRepository
    name: flux-system