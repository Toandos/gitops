deployment:
  extraEnv:
    - name: DSN
      valueFrom:
        secretKeyRef:
          name: oidc-db-credentials
          key: DSN

job:
  extraEnv:
    - name: DSN
      valueFrom:
        secretKeyRef:
          name: oidc-db-credentials
          key: DSN

hydra:
  automigration:
    enabled: true

  config:
    serve:
        public:
            port: 4444
        admin:
            port: 4445

    urls:
        self:
            public: https://oidc.toando.de
            issuer: https://oidc.toando.de
        login: https://accounts.toando.de/login
        consent: https://accounts.toando.de/consent

    secrets:
        system: ["UF0DWLdx4ZmWyHuw6t7RUqXNl9S7DT10"]