apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kratos
spec:
  interval: 30m
  chart:
    spec:
      chart: kratos
      version: "v0.63.0"
      sourceRef:
        kind: HelmRepository
        name: ory
        namespace: platform-sources
  
  valuesFrom:
    - kind: ConfigMap
      name: kratos-values
      valuesKey: values.yaml