apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 30m

  releaseName: eg
  chartRef:
    kind: OCIRepository
    name: envoy-gateway

  install:
    crds: Create

  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m