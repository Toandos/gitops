apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager

spec:
  interval: 30m

  chart:
    spec:
      chart: cert-manager
      version: "v1.21.1"
      sourceRef:
        kind: HelmRepository
        name: jetstack
  install:
    crds: Create

  upgrade:
    crds: CreateReplace

  values:
    crds:
      enabled: true