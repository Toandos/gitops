apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ory-kratos
spec:
  parentRefs:
    - name: public-gateway
      namespace: traefik

  hostnames:
    - accounts.toando.de

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /

      backendRefs:
        - name: ory-kratos
          port: 4433