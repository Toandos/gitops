providers:
    kubernetesGateway:
        enabled: true

entryPoints:
    web:
        address: ":80"
        http:
            redirections:
                entryPoint:
                    to: websecure
                    scheme: https

    websecure:
        address: ":443"

certificatesResolvers:
    le:
        acme:
            email: admin@toando.de
            storage: /etc/letsencrypt/acme.json
            dnsChallenge:
                provider: cloudflare