apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: networking

helmCharts:
  - name: cert-manager
    repo: oci://quay.io/jetstack/charts/cert-manager
    version: v1.21.1
    namespace: networking
    releaseName: cert-manager
    includeCRDs: true

resources:
  - cloudflare-api-token.yaml
  - cluster-issuer.yaml
  - toando-de-certificate.yaml