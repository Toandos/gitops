apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/toandos/dashboard:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: postgres://dashboard:dashboard_password@postgres:5432/dashboard?sslmode=disable
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "1Gi"