apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: accounts
  namespace: flux-system
spec:
  interval: 10m
  path: ./products/accounts
  prune: true
  wait: true
  dependsOn:
    - name: oidc
    - name: postgres
  sourceRef:
    kind: GitRepository
    name: flux-system