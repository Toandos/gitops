apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: accounts-kustomization
spec:
  interval: 10m
  path: ./production
  prune: true
  wait: true
  dependsOn:
    - name: mail
    - name: oidc
    - name: postgres
  sourceRef:
    kind: GitRepository
    name: accounts-repository