apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: dashboard
spec:
  interval: 5m
  url: oci://ghcr.io/toandos/charts/dashboard
  serviceAccountName: default
  ref:
    semver: ">=0.1.0"
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy