apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-service-db-credentials
spec:
  target:
    name: app-service-db-credentials
    template:
      metadata:
        annotations:
          cnpg.io/reload: "true"
          replicator.v1.mittwald.de/replicate-to: "app-service"
      type: kubernetes.io/basic-auth
      data:
        username: app-service
        password: "{{ .password }}"

        DATABASE_URL: "postgres://app-service:{{ .password }}@postgres-rw.postgres:5432/app-service?sslmode=disable"

  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: app-service-db-password